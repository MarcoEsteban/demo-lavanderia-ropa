<script>
  /* ==========================================================================
     APP CORE — estado, router, llamadas al backend y helpers de UI.
     No contiene lógica de negocio: todo pasa por google.script.run y las
     funciones de Codigo.js / Operaciones.js.
     ========================================================================== */
  (function () {
    'use strict';

    var App = {
      boot: window.BOOT || {},
      sesion: null,
      ctx: null,
      vista: '',
      _limpiarVista: null,
      _modal: null,
      _carga: 0,
      _cargaTimer: null,
      _reloj: null,
      ICONOS: {
        buscar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>',
        mas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
        whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.6 0-3.2-.4-4.5-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.6-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.7.8-.8 1-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5v-.5c0-.2-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.2-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.2.7 3 .6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2Z"/></svg>',
        imprimir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>',
        refrescar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>',
        alerta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 17.4A2 2 0 0 0 4.1 20h15.8a2 2 0 0 0 1.7-2.6L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>',
        reloj: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
        bolsa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1.5 13h-15L6 7Z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>',
        copiar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
        sobre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
        efectivo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>',
        qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14h1M14 20h1M18 20h3v1"/></svg>',
        flecha: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
        volver: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>'
      }
    };

    // ------------------------------------------------------------------
    // Utilidades DOM
    // ------------------------------------------------------------------
    function $(sel, raiz) { return (raiz || document).querySelector(sel); }
    function $$(sel, raiz) { return Array.prototype.slice.call((raiz || document).querySelectorAll(sel)); }

    App.$ = $;
    App.$$ = $$;

    App.esc = function (valor) {
      return String(valor == null ? '' : valor)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    };

    App.icono = function (nombre) { return App.ICONOS[nombre] || ''; };

    App.bs = function (monto) {
      var simbolo = (App.ctx && App.ctx.negocio && App.ctx.negocio.monedaSimbolo) ||
        (App.boot.negocio && App.boot.negocio.monedaSimbolo) || 'Bs.';
      var n = Number(monto) || 0;
      var txt;
      try {
        txt = new Intl.NumberFormat('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Math.abs(n));
      } catch (err) {
        txt = Math.abs(n).toFixed(2);
      }
      return (n < 0 ? '− ' : '') + simbolo + ' ' + txt;
    };

    App.kg = function (n) {
      var v = Math.round((Number(n) || 0) * 10) / 10;
      return String(v).replace('.', ',') + ' kg';
    };

    App.num = function (n) {
      return new Intl.NumberFormat('es-BO').format(Number(n) || 0);
    };

    App.zona = function () {
      return (App.ctx && App.ctx.negocio && App.ctx.negocio.zonaHoraria) || 'America/La_Paz';
    };

    App.fechaMs = function (ms) {
      if (!ms) return '—';
      try {
        return new Intl.DateTimeFormat('es-BO', {
          day: '2-digit', month: '2-digit', year: 'numeric', timeZone: App.zona()
        }).format(new Date(ms));
      } catch (err) { return '—'; }
    };

    App.horaMs = function (ms) {
      if (!ms) return '—';
      try {
        return new Intl.DateTimeFormat('es-BO', {
          hour: '2-digit', minute: '2-digit', hour12: false, timeZone: App.zona()
        }).format(new Date(ms));
      } catch (err) { return '—'; }
    };

    App.fechaHoraMs = function (ms) {
      return App.fechaMs(ms) + ' · ' + App.horaMs(ms);
    };

    var DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];

    App.fechaISO = function (iso) {
      if (!iso) return '—';
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
      if (!m) return String(iso);
      var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
      return DIAS[d.getUTCDay()] + ' ' + m[3] + '/' + m[2];
    };

    App.fechaLargaISO = function (iso) {
      if (!iso) return '—';
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
      if (!m) return String(iso);
      var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
      return DIAS[d.getUTCDay()] + ' ' + m[3] + '/' + m[2] + '/' + m[1];
    };

    App.estadoClase = function (estado) { return 'estado-' + String(estado || ''); };

    App.estadoLabel = function (estado) {
      var encontrado = (App.ctx && App.ctx.estados || []).filter(function (e) { return e.id === estado; })[0];
      if (encontrado) return encontrado.label;
      var extra = { cancelada: 'Cancelada' };
      return extra[estado] || estado || '—';
    };

    App.estadoBadge = function (estado) {
      return '<span class="pastilla ' + App.estadoClase(estado) + '">' + App.esc(App.estadoLabel(estado)) + '</span>';
    };

    App.pagoBadge = function (estado) {
      var label = estado === 'pagado' ? 'Pagado' : (estado === 'parcial' ? 'Pago parcial' : 'Sin pago');
      return '<span class="pastilla-pago pastilla-pago--' + App.esc(estado || 'pendiente') + '">' + label + '</span>';
    };

    App.waLink = function (telefono, texto) {
      var local = String(telefono || '').replace(/\D/g, '');
      if (local.indexOf('591') === 0 && local.length > 8) local = local.slice(3);
      return 'https://wa.me/591' + local + '?text=' + encodeURIComponent(texto || '');
    };

    // ------------------------------------------------------------------
    // Toast / carga / modal
    // ------------------------------------------------------------------
    App.toast = function (mensaje, tipo, ms) {
      var zona = $('#toastZona');
      if (!zona) return;
      var clase = tipo === 'error' ? 'toast--error' : (tipo === 'exito' ? 'toast--exito' : 'toast--info');
      var icono = tipo === 'error' ? 'alerta' : (tipo === 'exito' ? 'check' : 'sobre');
      var el = document.createElement('div');
      el.className = 'toast ' + clase;
      el.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
      el.innerHTML = App.icono(icono) + '<span>' + App.esc(mensaje) + '</span>';
      zona.appendChild(el);
      window.setTimeout(function () {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        el.style.transition = 'opacity .2s ease, transform .2s ease';
        window.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
      }, ms || 3800);
    };

    App.textoCarga = function (texto) {
      var el = $('#capaCargaTexto');
      if (el) el.textContent = texto || 'Procesando…';
    };

    function pintarCarga() {
      var capa = $('#capaCarga');
      if (!capa) return;
      if (App._carga > 0) {
        if (!capa.classList.contains('visible')) {
          App._cargaTimer = window.setTimeout(function () {
            if (App._carga > 0) capa.classList.add('visible');
          }, 120);
        }
      } else {
        window.clearTimeout(App._cargaTimer);
        capa.classList.remove('visible');
      }
    }

    App.cargando = function (delta, texto) {
      App._carga = Math.max(0, App._carga + (delta || 1));
      if (texto) App.textoCarga(texto);
      pintarCarga();
    };

    App.modal = function (opciones) {
      var o = opciones || {};
      App.cerrarModal();

      var fondo = document.createElement('div');
      fondo.className = 'modal-fondo';
      var ancho = o.ancho === 'ancho' ? ' modal--ancho' : (o.ancho === 'angosto' ? ' modal--angosto' : '');

      var acciones = (o.acciones || []).map(function (accion, i) {
        return '<button type="button" class="btn ' + (accion.clase || 'btn-secundario') + '" data-accion="' + i + '">' +
          App.esc(accion.label) + '</button>';
      }).join('');

      fondo.innerHTML =
        '<div class="modal' + ancho + '" role="dialog" aria-modal="true" aria-label="' + App.esc(o.titulo || 'Detalle') + '">' +
          '<div class="modal__cabecera">' +
            '<div>' +
              '<h2 class="modal__titulo">' + App.esc(o.titulo || '') + '</h2>' +
              (o.sub ? '<div class="modal__sub">' + App.esc(o.sub) + '</div>' : '') +
            '</div>' +
            '<button type="button" class="modal__cerrar" aria-label="Cerrar">&times;</button>' +
          '</div>' +
          '<div class="modal__cuerpo">' + (o.cuerpo || '') + '</div>' +
          (acciones ? '<div class="modal__acciones">' + acciones + '</div>' : '') +
        '</div>';

      document.body.appendChild(fondo);
      document.body.style.overflow = 'hidden';
      App._modal = fondo;

      function escapeHandler(ev) {
        if (ev.key === 'Escape') App.cerrarModal();
      }
      document.addEventListener('keydown', escapeHandler);

      App._alCerrarModal = function () {
        document.removeEventListener('keydown', escapeHandler);
        if (typeof o.onCerrar === 'function') o.onCerrar();
      };

      function cerrar() { App.cerrarModal(); }

      var botonCerrar = $('.modal__cerrar', fondo);
      if (botonCerrar) botonCerrar.addEventListener('click', cerrar);
      fondo.addEventListener('mousedown', function (ev) { if (ev.target === fondo) cerrar(); });

      var accionesEls = $$('[data-accion]', fondo);
      accionesEls.forEach(function (boton) {
        boton.addEventListener('click', function () {
          var accion = o.acciones[Number(boton.getAttribute('data-accion'))];
          if (!accion) return;
          if (accion.onClick) {
            var resultado = accion.onClick(fondo);
            if (resultado === false) return; // el handler decidió no cerrar
          }
          // Solo cerrar el modal que originó la acción: el handler pudo abrir otro.
          if (accion.cerrar !== false && App._modal === fondo) cerrar();
        });
      });

      var foco = $('.modal__acciones .btn-primario', fondo) || accionesEls[0] || botonCerrar;
      if (foco) window.setTimeout(function () { foco.focus(); }, 40);

      return { el: fondo, cerrar: cerrar };
    };

    App.cerrarModal = function () {
      if (!App._modal) return;
      if (App._modal.parentNode) App._modal.parentNode.removeChild(App._modal);
      App._modal = null;
      document.body.style.overflow = '';
      var alCerrar = App._alCerrarModal;
      App._alCerrarModal = null;
      if (alCerrar) alCerrar();
    };

    App.confirmar = function (opciones) {
      var o = opciones || {};
      return new Promise(function (resolve) {
        var resuelto = false;
        function fin(valor) {
          if (resuelto) return;
          resuelto = true;
          resolve(valor);
        }
        App.modal({
          titulo: o.titulo || '¿Confirmás?',
          sub: o.sub || '',
          ancho: 'angosto',
          onCerrar: function () { fin(false); },
          cuerpo: '<p style="margin:0;font-size:14px;line-height:1.6;">' + App.esc(o.mensaje || '') + '</p>',
          acciones: [
            { label: o.cancelar || 'Cancelar', clase: 'btn-texto', onClick: function () { fin(false); } },
            { label: o.confirmar || 'Confirmar', clase: o.peligro ? 'btn-peligro' : 'btn-primario', onClick: function () { fin(true); } }
          ]
        });
      });
    };

    // ------------------------------------------------------------------
    // Llamadas al backend
    // ------------------------------------------------------------------
    App.api = function (nombreFn) {
      var args = Array.prototype.slice.call(arguments, 1);
      App.cargando(1);
      return new Promise(function (resolve) {
        var terminado = false;
        function terminar(res) {
          if (terminado) return;
          terminado = true;
          App.cargando(-1);
          if (res && res.ok === false && /Sesi[oó]n vencida/i.test(res.error || '')) {
            App.salir(true);
            resolve(res);
            return;
          }
          resolve(res || { ok: false, error: 'El servidor no respondió.' });
        }
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          terminar({ ok: false, error: 'Esta página tiene que abrirse desde la Web App de Apps Script.' });
          return;
        }
        try {
          var runner = google.script.run
            .withSuccessHandler(terminar)
            .withFailureHandler(function (err) {
              terminar({ ok: false, error: (err && err.message) || 'No pudimos conectar con el servidor.' });
            });
          runner[nombreFn].apply(runner, args);
        } catch (err) {
          terminar({ ok: false, error: err && err.message ? err.message : String(err) });
        }
      });
    };

    // ------------------------------------------------------------------
    // Sesión / navegación
    // ------------------------------------------------------------------
    function guardarSesion(sesion) {
      try { sessionStorage.setItem('lav_sesion', JSON.stringify(sesion)); } catch (err) { /* modo privado */ }
    }

    function leerSesion() {
      try {
        var raw = sessionStorage.getItem('lav_sesion');
        return raw ? JSON.parse(raw) : null;
      } catch (err) { return null; }
    }

    function borrarSesion() {
      try { sessionStorage.removeItem('lav_sesion'); } catch (err) { /* nada */ }
    }

    App.puedeVer = function (vista) {
      if (!App.sesion) return false;
      var boton = $('.nav__btn[data-vista="' + vista + '"]');
      if (!boton) return false;
      var roles = String(boton.getAttribute('data-roles') || '').split(',');
      return roles.indexOf(App.sesion.rol) > -1;
    };

    App.vistaInicial = function () {
      if (App.sesion && App.sesion.rol === 'admin') return 'tablero';
      return 'mostrador';
    };

    App.ir = function (vista, desdeHash) {
      if (!App.sesion) return;
      if (!App.puedeVer(vista)) {
        App.toast('No tenés acceso a esa sección.', 'error');
        return;
      }
      if (App.vista === vista) return;

      if (App._limpiarVista) {
        try { App._limpiarVista(); } catch (err) { /* noop */ }
        App._limpiarVista = null;
      }

      App.vista = vista;
      $$('.nav__btn').forEach(function (b) {
        b.classList.toggle('activo', b.getAttribute('data-vista') === vista);
      });

      var tituloVista = { mostrador: 'Mostrador', tablero: 'Tablero', entrega: 'Entrega', reportes: 'Reportes', configuracion: 'Configuración' }[vista] || vista;
      document.title = tituloVista + ' · ' + (App.ctx && App.ctx.negocio ? App.ctx.negocio.nombre : 'Lavandería');
      if (!desdeHash) {
        try { history.replaceState(null, '', '#' + vista); } catch (err) { /* iframe raro */ }
      }

      var cont = $('#vista');
      cont.innerHTML = '';
      var definicion = window.Vistas && window.Vistas[vista];
      if (!definicion) {
        cont.innerHTML = '<div class="vacio-bloque">Esa sección todavía no está disponible.</div>';
        return;
      }
      try {
        var limpiar = definicion.montar(cont);
        if (typeof limpiar === 'function') App._limpiarVista = limpiar;
      } catch (err) {
        cont.innerHTML = '<div class="vacio-bloque"><strong>Algo salió mal.</strong>' + App.esc(err.message || String(err)) + '</div>';
      }
    };

    App.entrar = function () {
      var login = $('#pantalla-login');
      var app = $('#app');
      if (login) login.classList.add('oculto');
      if (app) app.classList.remove('oculto');

      if (App.ctx) {
        var nombre = App.ctx.negocio.nombre || 'Lavandería';
        var marcaNombre = $('#marcaNombre');
        var marcaRol = $('#marcaRol');
        if (marcaNombre) marcaNombre.textContent = nombre;
        if (marcaRol) marcaRol.textContent = App.sesion.rol === 'admin' ? 'Administración' : 'Mostrador';
        document.title = 'Panel · ' + nombre;
      }

      $$('.nav__btn').forEach(function (boton) {
        var roles = String(boton.getAttribute('data-roles') || '').split(',');
        boton.classList.toggle('oculto', roles.indexOf(App.sesion.rol) === -1);
      });

      App.iniciarReloj();

      var hash = (location.hash || '').replace('#', '');
      var destino = (hash && App.puedeVer(hash)) ? hash : App.vistaInicial();
      App.vista = '';
      App.ir(destino, true);
    };

    App.salir = function (porVencimiento) {
      if (App.sesion && App.sesion.token && !porVencimiento) {
        App.api('cerrarSesion', App.sesion.token);
      }
      App.sesion = null;
      App.ctx = null;
      borrarSesion();
      if (App._limpiarVista) {
        try { App._limpiarVista(); } catch (err) { /* noop */ }
        App._limpiarVista = null;
      }
      App.vista = '';
      if (App._reloj) { window.clearInterval(App._reloj); App._reloj = null; }

      var login = $('#pantalla-login');
      var app = $('#app');
      if (app) app.classList.add('oculto');
      if (login) login.classList.remove('oculto');
      var pin = $('#pin');
      var error = $('#loginError');
      if (pin) pin.value = '';
      if (error) error.textContent = porVencimiento ? 'Tu sesión venció. Volvé a ingresar.' : '';
      if (pin) pin.focus();
      document.title = 'Acceso · ' + ((App.boot.negocio && App.boot.negocio.nombre) || 'Lavandería');
    };

    App.iniciarReloj = function () {
      if (App._reloj) window.clearInterval(App._reloj);
      function pintar() {
        var el = $('#reloj');
        if (!el) return;
        try {
          el.textContent = new Intl.DateTimeFormat('es-BO', {
            weekday: 'short', day: '2-digit', month: 'short',
            hour: '2-digit', minute: '2-digit', hour12: false, timeZone: App.zona()
          }).format(new Date()).replace(',', ' ·');
        } catch (err) { el.textContent = ''; }
      }
      pintar();
      App._reloj = window.setInterval(pintar, 30000);
    };

    // ------------------------------------------------------------------
    // Recibo imprimible
    // ------------------------------------------------------------------
    App.imprimirRecibo = function (orden) {
      if (!orden) return;
      var link = orden.linkEstado ||
        (App.boot.scriptUrl ? App.boot.scriptUrl + '?estado=' + encodeURIComponent(orden.token || '') : '');
      var qr = link
        ? 'https://quickchart.io/qr?size=180&margin=1&text=' + encodeURIComponent(link)
        : '';
      var cfg = (App.ctx && App.ctx.negocio) || App.boot.negocio || {};
      var lineas = (orden.lineas || []).map(function (l) {
        var cantidad = l.tipo === 'general_kg' ? App.kg(l.cantidad) : (App.num(l.cantidad) + ' u.');
        return '<div class="recibo__fila"><span>' + App.esc(l.descripcion) + '</span><span>' + App.bs(l.subtotal) + '</span></div>' +
          (l.tipo === 'descuento'
            ? ''
            : '<div class="recibo__fila" style="color:#555;font-size:9.5px;margin-top:-2px"><span>' + App.esc(cantidad) + '</span><span></span></div>');
      }).join('');

      var saldo = orden.saldo > 0.005
        ? '<div class="recibo__fila"><span>Saldo a pagar</span><strong>' + App.bs(orden.saldo) + '</strong></div>'
        : '<div class="recibo__centro" style="font-weight:700;margin-top:4px">PAGADO</div>';

      var html =
        '<div class="recibo">' +
          '<div class="recibo__centro">' +
            '<div class="recibo__marca">' + App.esc(cfg.nombre || 'Lavandería') + '</div>' +
            '<div>' + App.esc(cfg.direccion || '') + '</div>' +
            '<div>' + App.esc(cfg.telefonoBonito || cfg.telefono || '') + '</div>' +
          '</div>' +
          '<div class="recibo__sep"></div>' +
          '<div class="recibo__centro recibo__codigo">' + App.esc(orden.codigo) + '</div>' +
          '<div class="recibo__centro">' + App.fechaHoraMs(orden.recepcionMs) + '</div>' +
          '<div class="recibo__sep"></div>' +
          '<div class="recibo__fila"><span>Cliente</span><strong>' + App.esc(orden.cliente.nombre) + '</strong></div>' +
          '<div class="recibo__fila"><span>Celular</span><span>' + App.esc(orden.cliente.telefonoBonito) + '</span></div>' +
          '<div class="recibo__fila"><span>Servicio</span><span>' + App.esc(orden.servicioNombre) + '</span></div>' +
          '<div class="recibo__fila"><span>Peso</span><span>' + App.kg(orden.pesoKg) +
            (Number(orden.pesoCobrado) > Number(orden.pesoKg) + 0.0001 ? ' / cobrado ' + App.kg(orden.pesoCobrado) : '') +
            '</span></div>' +
          (orden.prendas ? '<div class="recibo__fila"><span>Prendas</span><span>' + orden.prendas + '</span></div>' : '') +
          '<div class="recibo__fila"><span>Entrega</span><strong>' + App.fechaLargaISO(orden.fechaPrometida) + '</strong></div>' +
          '<div class="recibo__sep"></div>' +
          lineas +
          '<div class="recibo__sep"></div>' +
          '<div class="recibo__fila recibo__fila--total"><span>TOTAL</span><span>' + App.bs(orden.total) + '</span></div>' +
          (orden.pagado > 0 ? '<div class="recibo__fila"><span>Pagado</span><span>' + App.bs(orden.pagado) + '</span></div>' : '') +
          saldo +
          (orden.observaciones ? '<div class="recibo__sep"></div><div><strong>Nota:</strong> ' + App.esc(orden.observaciones) + '</div>' : '') +
          (qr ? '<div class="recibo__qr"><img src="' + qr + '" alt="QR de estado del pedido"><div style="font-size:9px;color:#555;margin-top:2px">Escaneá para ver el estado</div></div>' : '') +
          '<div class="recibo__pie">' + App.esc(cfg.pagoInstrucciones || '') + '<br>' + App.esc((App.ctx && App.ctx.cfg && App.ctx.cfg.piePagina) || '') + '</div>' +
        '</div>';

      var zona = $('#recibo-impresion');
      if (!zona) return;
      zona.innerHTML = html;
      document.body.classList.add('imprimiendo');
      function limpiar() {
        document.body.classList.remove('imprimiendo');
        window.removeEventListener('afterprint', limpiar);
      }
      window.addEventListener('afterprint', limpiar);
      window.setTimeout(function () {
        try { window.print(); } catch (err) { App.toast('El navegador bloqueó la impresión. Probá abrir el recibo en otra pestaña.', 'error'); }
        window.setTimeout(limpiar, 1500);
      }, 60);
    };

    // ------------------------------------------------------------------
    // Arranque
    // ------------------------------------------------------------------
    App.iniciar = function () {
      var rol = 'staff';
      $$('.rol').forEach(function (boton) {
        boton.addEventListener('click', function () {
          rol = boton.getAttribute('data-rol');
          $$('.rol').forEach(function (b) {
            b.classList.toggle('seleccionado', b === boton);
            b.setAttribute('aria-selected', b === boton ? 'true' : 'false');
          });
          var pin = $('#pin');
          if (pin) pin.focus();
        });
      });

      var demo = $('#demoPins');
      if (demo) demo.classList.remove('oculto');

      var form = $('#formLogin');
      if (form) {
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          var pin = ($('#pin').value || '').trim();
          var errorEl = $('#loginError');
          var boton = $('#btnEntrar');
          if (!pin) {
            errorEl.textContent = 'Ingresá el PIN.';
            return;
          }
          errorEl.textContent = '';
          boton.disabled = true;
          boton.textContent = 'Entrando…';
          App.api('iniciarSesion', { rol: rol, pin: pin }).then(function (res) {
            boton.disabled = false;
            boton.textContent = 'Entrar';
            if (!res.ok) {
              errorEl.textContent = res.error || 'No pudimos iniciar sesión.';
              return;
            }
            App.sesion = { token: res.token, rol: res.rol, nombre: res.nombre };
            guardarSesion(App.sesion);
            cargarContexto().then(function (ok) {
              if (ok) App.entrar();
              else App.salir();
            });
          });
        });
      }

      var salir = $('#btnSalir');
      if (salir) salir.addEventListener('click', function () { App.salir(false); });

      $$('.nav__btn').forEach(function (boton) {
        boton.addEventListener('click', function () {
          App.ir(boton.getAttribute('data-vista'));
        });
      });

      window.addEventListener('hashchange', function () {
        if (!App.sesion) return;
        var hash = (location.hash || '').replace('#', '');
        if (hash && hash !== App.vista) App.ir(hash, true);
      });

      if (!App.boot.authConfigurada) {
        var error = $('#loginError');
        if (error) error.textContent = 'Falta ejecutar setup() desde el editor de Apps Script.';
      }

      var guardada = leerSesion();
      if (guardada && guardada.token) {
        App.sesion = guardada;
        App.cargando(1, 'Restaurando sesión…');
        cargarContexto().then(function (ok) {
          App.cargando(-1);
          if (ok) App.entrar();
          else { App.sesion = null; borrarSesion(); }
        });
      } else {
        var pin = $('#pin');
        if (pin) window.setTimeout(function () { pin.focus(); }, 200);
      }
    };

    function cargarContexto() {
      return App.api('getContexto', App.sesion.token).then(function (res) {
        if (!res.ok) {
          App.toast(res.error || 'No pudimos cargar el contexto.', 'error');
          return false;
        }
        App.ctx = res;
        return true;
      });
    }

    App.recargarContexto = function () {
      return cargarContexto();
    };

    App.recargarVista = function () {
      if (App.vista) {
        var v = App.vista;
        App.vista = '';
        App.ir(v, true);
      }
    };

    window.App = App;
    window.Vistas = window.Vistas || {};
  })();
</script>
