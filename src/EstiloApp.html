<style>
  /* ==========================================================================
     ESTILO DE LA APP — "Agua & Lino"
     Se apoya en EstiloBase.html (tokens, botones, campos, tarjetas) y agrega
     la cáscara del panel, tablero, recibos y la pantalla de acceso.
     ========================================================================== */

  :root {
    --tinta-suave: #5E6B70;
    --linea: #DFE7E9;
    --fondo-panel: #FFFFFF;
    --fondo-tenue: #F2F7F8;
    --radio-grande: 22px;
    --sombra-flotante: 0 18px 50px rgba(11, 79, 96, .16);
  }

  body.app {
    min-height: 100dvh;
    background:
      radial-gradient(1100px 500px at 8% -10%, color-mix(in srgb, var(--color-acento) 78%, #fff) 0%, transparent 60%),
      radial-gradient(900px 420px at 100% 0%, #FDF5E8 0%, transparent 55%),
      var(--color-fondo);
    background-attachment: fixed;
  }

  .app-shell {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 clamp(12px, 3vw, 28px) 96px;
  }

  /* ---------- Barra superior ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: color-mix(in srgb, #FBFAF7 86%, transparent);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid color-mix(in srgb, var(--color-borde) 70%, transparent);
  }

  .topbar__inner {
    max-width: 1320px;
    margin: 0 auto;
    padding: 10px clamp(12px, 3vw, 28px);
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .marca {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
    text-decoration: none;
    color: inherit;
  }

  .marca__icono {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    color: #fff;
    background:
      radial-gradient(120% 120% at 20% 10%, color-mix(in srgb, var(--color-secundario) 70%, #fff) 0%, transparent 45%),
      linear-gradient(145deg, var(--color-primario), color-mix(in srgb, var(--color-primario) 72%, #000));
    box-shadow: 0 6px 16px rgba(11, 79, 96, .25);
  }

  .marca__icono svg { width: 22px; height: 22px; }

  .marca__texto { min-width: 0; }
  .marca__nombre {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 17px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 36vw;
  }
  .marca__rol {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--tinta-suave);
  }

  .nav {
    display: flex;
    gap: 3px;
    padding: 3px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--color-acento) 60%, #fff);
    border: 1px solid color-mix(in srgb, var(--color-borde) 80%, transparent);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }

  .nav__btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--color-texto);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 15px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: background .15s ease, color .15s ease, transform .1s ease;
  }
  .nav__btn svg { width: 16px; height: 16px; opacity: .8; }
  .nav__btn:hover { background: rgba(255, 255, 255, .7); }
  .nav__btn.activo {
    background: var(--color-primario);
    color: #fff;
    box-shadow: 0 4px 12px rgba(11, 79, 96, .25);
  }
  .nav__btn.activo svg { opacity: 1; }

  .topbar__acciones {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .reloj {
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    color: var(--tinta-suave);
    white-space: nowrap;
  }

  .btn-icono {
    appearance: none;
    border: 1px solid var(--color-borde);
    background: #fff;
    color: var(--tinta-suave);
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .btn-icono:hover { border-color: var(--color-secundario); color: var(--color-primario); }
  .btn-icono svg { width: 18px; height: 18px; }

  /* ---------- Estructura de vista ---------- */
  .vista { padding-top: 22px; animation: aparecer .25s ease; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .vista__cabecera {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .vista__titulo { margin: 0; font-size: clamp(26px, 3.4vw, 36px); }
  .vista__bajada { color: var(--tinta-suave); font-size: 14px; margin: 4px 0 0; }

  .grilla { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .grilla--mostrador { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
  .grilla--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grilla--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grilla--reportes { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; }

  @media (max-width: 1080px) {
    .nav__btn span { display: none; }
    .nav__btn { padding: 9px 12px; }
    .grilla--reportes { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 960px) {
    .grilla--mostrador { grid-template-columns: minmax(0, 1fr); }
    .grilla--3 { grid-template-columns: minmax(0, 1fr); }
    .resumen-flotante { position: static !important; }
    .topbar__inner { gap: 10px; }
    .reloj { display: none; }
  }
  @media (max-width: 680px) {
    .grilla--2 { grid-template-columns: minmax(0, 1fr); }
    .marca__nombre { max-width: 40vw; }
    .marca__rol { display: none; }
    .app-shell { padding-bottom: 120px; }
  }

  /* Barra superior en dos filas: marca + salir arriba, navegación abajo. */
  @media (max-width: 760px) {
    .topbar__inner { flex-wrap: wrap; gap: 8px; padding-top: 8px; padding-bottom: 8px; }
    .marca { order: 1; }
    .topbar__acciones { order: 2; }
    .nav { order: 3; width: 100%; justify-content: flex-start; }
  }

  .tarjeta--plana { box-shadow: none; }

  .seccion-titulo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--color-primario);
    margin: 0 0 14px;
  }

  .paso-num {
    width: 26px;
    height: 26px;
    flex: 0 0 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    color: #fff;
    background: var(--color-primario);
  }

  .ayuda { color: var(--tinta-suave); font-size: 12.5px; line-height: 1.45; }
  .error-campo { color: var(--color-peligro); font-size: 12.5px; margin-top: 4px; }
  .oculto { display: none !important; }

  /* ---------- Formulario de recepción ---------- */
  .peso-caja {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border: 1.5px solid var(--color-borde);
    border-radius: 16px;
    background: var(--fondo-tenue);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .peso-caja:focus-within {
    border-color: var(--color-primario);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-primario) 12%, transparent);
  }
  .peso-caja input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    font: inherit;
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(30px, 4vw, 40px);
    font-weight: 600;
    color: var(--color-primario);
    padding: 0;
    outline: none;
  }
  .peso-caja__unidad { font-size: 15px; color: var(--tinta-suave); font-weight: 600; }
  .peso-caja__min { font-size: 11.5px; color: var(--color-secundario-texto); background: #FDF3E4; padding: 4px 8px; border-radius: 999px; }

  .servicios {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
  }

  .servicio {
    position: relative;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 13px 14px;
    border: 1.5px solid var(--color-borde);
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .servicio:hover { border-color: var(--color-secundario); }
  .servicio:active { transform: scale(.995); }
  .servicio input { position: absolute; opacity: 0; pointer-events: none; }
  .servicio.seleccionado {
    border-color: var(--color-primario);
    background: color-mix(in srgb, var(--color-acento) 55%, #fff);
    box-shadow: inset 0 0 0 1px var(--color-primario);
  }
  .servicio__radio {
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    margin-top: 2px;
    border-radius: 50%;
    border: 2px solid #C7D3D6;
    display: grid;
    place-items: center;
  }
  .servicio.seleccionado .servicio__radio { border-color: var(--color-primario); }
  .servicio.seleccionado .servicio__radio::after {
    content: '';
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--color-primario);
  }
  .servicio__nombre { font-weight: 600; font-size: 14px; line-height: 1.25; }
  .servicio__detalle { font-size: 11.5px; color: var(--tinta-suave); margin-top: 3px; }
  .servicio__precio { font-weight: 700; color: var(--color-secundario-texto); font-size: 13.5px; white-space: nowrap; }

  .linea-especial {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--linea);
  }
  .linea-especial:last-child { border-bottom: 0; }
  .linea-especial__nombre { flex: 1; min-width: 0; font-size: 14px; }
  .linea-especial__precio { font-size: 12.5px; color: var(--tinta-suave); }
  .stepper { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--color-borde); border-radius: 999px; padding: 2px; background: #fff; }
  .stepper button {
    appearance: none; border: 0; background: transparent; width: 28px; height: 28px; border-radius: 50%;
    font-size: 17px; line-height: 1; color: var(--color-primario); cursor: pointer; font-weight: 600;
  }
  .stepper button:hover { background: var(--fondo-tenue); }
  .stepper output { min-width: 26px; text-align: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }

  .interruptor {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1.5px solid var(--color-borde);
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
  }
  .interruptor input { position: absolute; opacity: 0; pointer-events: none; }
  .interruptor__pista {
    width: 42px; height: 24px; flex: 0 0 42px; border-radius: 999px; background: #D9E2E4; position: relative; transition: background .15s ease;
  }
  .interruptor__pista::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .15s ease;
  }
  .interruptor input:checked + .interruptor__pista { background: var(--color-secundario); }
  .interruptor input:checked + .interruptor__pista::after { transform: translateX(18px); }
  .interruptor__texto { flex: 1; font-size: 13.5px; }
  .interruptor__texto strong { display: block; font-size: 14px; }

  /* ---------- Resumen / totales ---------- */
  .resumen-flotante { position: sticky; top: 82px; }

  .resumen-total {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0 4px;
    border-top: 1px solid var(--linea);
    margin-top: 10px;
  }
  .resumen-total__label { font-size: 14px; color: var(--tinta-suave); }
  .resumen-total__valor { font-family: 'Fraunces', Georgia, serif; font-size: 34px; font-weight: 700; color: var(--color-primario); }

  .totales-linea {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 0;
    font-size: 13px;
  }
  .totales-linea span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .totales-linea--tenue span { color: var(--tinta-suave); font-weight: 500; }
  .totales-linea--descuento span:last-child { color: var(--color-exito); }

  .chip-info {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--fondo-tenue);
    color: var(--color-primario);
  }
  .chip-info--alerta { background: #FDF1DF; color: var(--color-alerta); }
  .chip-info svg { width: 13px; height: 13px; flex: 0 0 auto; }

  /* ---------- Pastillas de estado ---------- */
  .estado-recibida { --estado: #5B7C99; --estado-suave: #EAF1F6; }
  .estado-clasificacion { --estado: #3A7CA5; --estado-suave: #E7F1F8; }
  .estado-lavado { --estado: #0B7A8C; --estado-suave: #E2F3F5; }
  .estado-secado { --estado: #C98A2E; --estado-suave: #FBF0DC; }
  .estado-planchado { --estado: #7A6BB5; --estado-suave: #EFECF9; }
  .estado-empaquetado { --estado: #9A7B4F; --estado-suave: #F5EEE4; }
  .estado-lista { --estado: #2E7D4F; --estado-suave: #E4F3EA; }
  .estado-entregada { --estado: #67737A; --estado-suave: #ECEFEF; }
  .estado-cancelada { --estado: #A13A3A; --estado-suave: #F7E6E6; }

  .pastilla {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .02em;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--estado-suave, #ECEFEF);
    color: var(--estado, #555);
    white-space: nowrap;
  }
  .pastilla::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pastilla--sin-punto::before { display: none; }

  .pastilla-pago {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    background: #ECEFEF;
    color: #555;
    white-space: nowrap;
  }
  .pastilla-pago--pendiente { background: #FCEFDD; color: #9A5D0F; }
  .pastilla-pago--parcial { background: #FFF1D6; color: #8A6508; }
  .pastilla-pago--pagado { background: #E2F3E8; color: #22663D; }

  /* ---------- Tablero ---------- */
  .tablero-herramientas {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .buscador {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 380px;
  }
  .buscador svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 17px;
    height: 17px;
    color: #93A3A8;
    pointer-events: none;
  }
  .buscador input {
    width: 100%;
    border: 1px solid var(--color-borde);
    background: #fff;
    border-radius: 999px;
    padding: 10px 14px 10px 38px;
    font: inherit;
    font-size: 13.5px;
    outline: none;
  }
  .buscador input:focus { border-color: var(--color-primario); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primario) 12%, transparent); }

  .tablero {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(232px, 1fr);
    gap: 12px;
    overflow-x: auto;
    align-items: start;
    padding-bottom: 12px;
    scroll-snap-type: x proximity;
  }
  .tablero::-webkit-scrollbar { height: 8px; }
  .tablero::-webkit-scrollbar-thumb { background: #CBD8DB; border-radius: 999px; }

  .columna-estado {
    scroll-snap-align: start;
    background: color-mix(in srgb, var(--estado-suave, #F2F7F8) 65%, #fff);
    border: 1px solid color-mix(in srgb, var(--estado, #999) 16%, var(--color-borde));
    border-radius: 16px;
    padding: 10px;
    min-height: 140px;
  }
  .columna-estado__cabecera {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 2px 4px 10px;
  }
  .columna-estado__titulo {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--estado, var(--color-primario));
  }
  .columna-estado__titulo::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--estado, #999); }
  .columna-estado__cuenta {
    font-size: 11px;
    font-weight: 700;
    background: #fff;
    color: var(--estado, #555);
    border-radius: 999px;
    padding: 2px 7px;
    border: 1px solid color-mix(in srgb, var(--estado, #999) 20%, transparent);
  }

  .tarjeta-orden {
    display: block;
    width: 100%;
    text-align: left;
    appearance: none;
    border: 1px solid color-mix(in srgb, var(--estado, #cfd9db) 22%, var(--color-borde));
    border-left: 3px solid var(--estado, #cfd9db);
    background: #fff;
    border-radius: 12px;
    padding: 10px 11px;
    margin-bottom: 8px;
    cursor: pointer;
    font: inherit;
    color: inherit;
    box-shadow: 0 1px 4px rgba(15, 60, 70, .05);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .tarjeta-orden:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(15, 60, 70, .1); }
  .tarjeta-orden:last-child { margin-bottom: 0; }
  .tarjeta-orden__top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .tarjeta-orden__codigo { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 14px; color: var(--color-primario); }
  .tarjeta-orden__cliente { font-size: 13px; font-weight: 600; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tarjeta-orden__meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 11.5px; color: var(--tinta-suave); }
  .tarjeta-orden__meta strong { color: var(--color-texto); font-weight: 600; }
  .tarjeta-orden__pie { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .tarjeta-orden__total { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
  .tarjeta-orden__alerta { font-size: 11px; font-weight: 700; color: var(--color-alerta); }
  .tarjeta-orden__alerta--vencida { color: var(--color-peligro); }
  .tarjeta-orden__aviso {
    display: flex; align-items: center; gap: 5px; margin-top: 8px; padding: 5px 8px;
    border-radius: 8px; background: #FDF6E9; color: #8A5A0B; font-size: 11px; font-weight: 600;
  }

  .columna-vacia {
    border: 1px dashed color-mix(in srgb, var(--estado, #999) 30%, var(--color-borde));
    border-radius: 10px;
    padding: 16px 8px;
    text-align: center;
    font-size: 11.5px;
    color: var(--tinta-suave);
  }

  /* ---------- Entrega ---------- */
  .lista-entrega { display: grid; gap: 10px; }

  .fila-orden {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    padding: 13px 15px;
    border: 1px solid var(--color-borde);
    border-radius: 14px;
    background: #fff;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .fila-orden:hover { border-color: color-mix(in srgb, var(--color-primario) 40%, var(--color-borde)); box-shadow: var(--sombra-suave); }
  .fila-orden__principal { min-width: 0; }
  .fila-orden__codigo { font-family: 'Fraunces', Georgia, serif; font-size: 15px; font-weight: 700; color: var(--color-primario); margin-right: 8px; }
  .fila-orden__nombre { font-weight: 600; font-size: 14px; }
  .fila-orden__meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 4px; font-size: 12px; color: var(--tinta-suave); }
  .fila-orden__acciones { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  @media (max-width: 640px) {
    .fila-orden { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .fila-orden__acciones { justify-content: flex-start; }
    .fila-orden__acciones > span { text-align: left !important; }
  }

  .btn-chico { padding: 8px 14px !important; font-size: 13px !important; }
