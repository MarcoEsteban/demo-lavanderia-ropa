<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Estado del pedido · <?= cfg.negocio_nombre ?></title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
  <?!= include('EstiloBase') ?>
  <style>
    :root {
      --color-primario: <?= tema.primario ?>;
      --color-secundario: <?= tema.secundario ?>;
      --color-acento: <?= tema.acento ?>;
    }
  </style>
  <style>
    /* ==========================================================================
       PÁGINA PÚBLICA DE ESTADO — pensada para el celular del cliente.
       ========================================================================== */

    body { background: #F4F1EA; }

    .estado-top {
      background: var(--color-primario);
      color: #fff;
      padding: calc(14px + env(safe-area-inset-top)) 18px 54px;
      border-radius: 0 0 26px 26px;
      position: relative;
      overflow: hidden;
    }
    .estado-top::after {
      content: '';
      position: absolute;
      inset: -40% -20% auto auto;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.14), transparent 68%);
      pointer-events: none;
    }
    .estado-top__inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 11px;
      position: relative;
      z-index: 1;
    }
    .estado-logo {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.18);
    }
    .estado-logo svg { width: 23px; height: 23px; }
    .estado-top__marca { min-width: 0; }
    .estado-top__marca strong {
      display: block;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .estado-top__marca span {
      display: block;
      font-size: 12px;
      color: var(--color-acento);
      opacity: .9;
      letter-spacing: .02em;
    }
    .estado-top__etiqueta {
      margin-left: auto;
      flex: 0 0 auto;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.2);
    }

    /* En pantallas muy chicas, el nombre del local no debe cortarse. */
    @media (max-width: 380px) {
      .estado-logo { width: 36px; height: 36px; flex-basis: 36px; }
      .estado-logo svg { width: 20px; height: 20px; }
      .estado-top__marca strong { font-size: 16px; }
      .estado-top__etiqueta { display: none; }
    }

    .estado-contenedor {
      margin-top: -38px;
      padding-bottom: calc(34px + env(safe-area-inset-bottom));
    }

    .estado-spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2.5px solid var(--color-borde);
      border-top-color: var(--color-secundario);
      animation: estado-girar .8s linear infinite;
      display: inline-block;
    }
    @keyframes estado-girar { to { transform: rotate(360deg); } }

    /* ---------- Tarjeta principal ---------- */
    .pedido { padding: 0; overflow: hidden; }

    .pedido__cabecera {
      padding: 20px 18px 18px;
      background: linear-gradient(160deg, #FFFFFF 0%, #FFFDF8 100%);
      border-bottom: 1px solid var(--color-borde);
    }
    .pedido__hola {
      font-size: 13px;
      color: #77736B;
      margin: 0 0 2px;
    }
    .pedido__codigo {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      color: var(--color-primario);
      letter-spacing: .01em;
      margin: 0 0 10px;
    }
    .pedido__estado-fila {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .estado-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--color-acento);
      color: var(--color-primario);
    }
    .estado-chip--lista { background: #DFF1E6; color: #1E5E3A; }
    .estado-chip--entregada { background: #E7E9E6; color: #4A514C; }
    .estado-chip--cancelada { background: #F6E1E1; color: #8E3030; }
    .estado-chip--proceso { background: var(--color-acento); color: var(--color-primario); }

    .pedido__descripcion {
      font-size: 14px;
      line-height: 1.55;
      color: #4F5A55;
      margin: 0;
    }

    .pedido__meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .pedido__meta div {
      background: var(--color-fondo);
      border: 1px solid var(--color-borde);
      border-radius: 12px;
      padding: 8px 10px;
      min-width: 0;
    }
    .pedido__meta span {
      display: block;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: #8A8579;
      margin-bottom: 2px;
    }
    .pedido__meta strong {
      display: block;
      font-size: 12.5px;
      line-height: 1.3;
      color: var(--color-texto);
      overflow-wrap: anywhere;
    }

    .pedido__cuerpo { padding: 18px; }

    .pedido__seccion-titulo {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #8A8579;
      margin: 0 0 10px;
    }

    .pedido__bloque + .pedido__bloque { margin-top: 22px; }

    /* ---------- Línea de progreso vertical ---------- */
    .estado-pasos {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .estado-paso {
      position: relative;
      display: flex;
      gap: 12px;
      padding-bottom: 15px;
      min-height: 28px;
    }
    .estado-paso:last-child { padding-bottom: 0; }
    .estado-paso__punto {
      position: relative;
      z-index: 1;
      width: 23px;
      height: 23px;
      flex: 0 0 23px;
      border-radius: 50%;
      border: 2px solid #D8D3C7;
      background: #fff;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }
    .estado-paso:not(:last-child) .estado-paso__punto::after {
      content: '';
      position: absolute;
      top: 21px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 21px;
      background: #E2DED4;
    }
    .estado-paso__texto {
      font-size: 14px;
      font-weight: 500;
      color: #8A8579;
      padding-top: 2px;
      line-height: 1.3;
    }
    .estado-paso__punto svg { width: 12px; height: 12px; }
    .estado-chip svg { width: 13px; height: 13px; }
    .estado-paso.hecho .estado-paso__punto {
      background: var(--color-primario);
      border-color: var(--color-primario);
    }
    .estado-paso.hecho:not(:last-child) .estado-paso__punto::after { background: var(--color-primario); }
    .estado-paso.hecho .estado-paso__texto { color: #4F5A55; }
    .estado-paso.actual .estado-paso__punto {
      border-color: var(--color-secundario);
      background: var(--color-secundario);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-secundario) 18%, transparent);
    }
    .estado-paso.actual .estado-paso__texto {
      color: var(--color-primario);
      font-weight: 700;
    }

    /* ---------- Detalle ---------- */
    .estado-linea {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--color-borde);
      font-size: 13.5px;
    }
    .estado-linea:last-child { border-bottom: 0; }
    .estado-linea__desc { min-width: 0; }
    .estado-linea__desc strong { display: block; font-weight: 500; line-height: 1.35; }
    .estado-linea__desc small { color: #8A8579; font-size: 11.5px; }
    .estado-linea__monto { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

    .estado-totales {
      margin-top: 6px;
      padding: 12px 14px;
      background: var(--color-fondo);
      border-radius: 12px;
    }
    .estado-totales .estado-linea { font-size: 13px; padding: 4px 0; border: 0; }
    .estado-totales .estado-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-top: 8px;
      padding-top: 9px;
      border-top: 1px solid var(--color-borde);
    }
    .estado-total span { font-size: 12px; color: #6F6A60; }
    .estado-total strong {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 25px;
      color: var(--color-primario);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .estado-total--saldo strong { color: var(--color-alerta); }
    .estado-total--pago strong { color: var(--color-exito); }

    /* ---------- Pago ---------- */
    .estado-pago {
      border: 1px solid #EFDFBC;
      background: #FFFBF1;
      border-radius: 14px;
      padding: 14px;
    }
    .estado-pago__fila {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .estado-pago img {
      width: 104px;
      height: 104px;
      flex: 0 0 104px;
      border-radius: 10px;
      background: #fff;
      padding: 6px;
      object-fit: contain;
      box-shadow: 0 2px 10px rgba(90, 60, 10, .12);
    }
    .estado-pago__texto { min-width: 0; }
    .estado-pago__texto strong {
      display: block;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 19px;
      color: #7A5A1D;
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .estado-pago__texto p {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: #7A5A1D;
    }
    .estado-pago__nota {
      margin-top: 10px;
      font-size: 11.5px;
      line-height: 1.5;
      color: #8A6A2E;
    }

    .estado-aviso {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 11px 13px;
      border-radius: 12px;
      font-size: 12.5px;
      line-height: 1.5;
      background: #E7F8EF;
      border: 1px solid #BFE8D2;
      color: #1E5E3A;
      margin-bottom: 12px;
    }
    .estado-aviso--alerta { background: #FDF3E2; border-color: #EFD9AE; color: #7A5A1D; }
    .estado-aviso svg { width: 17px; height: 17px; flex: 0 0 17px; margin-top: 1px; }
    .estado-aviso p { margin: 0; }

    .estado-acciones { display: grid; gap: 8px; margin-top: 12px; }
    .estado-acciones .btn { width: 100%; padding: 12px 18px; font-size: 14px; }
    .estado-acciones .btn svg { width: 17px; height: 17px; }

    /* ---------- Datos del local ---------- */
    .estado-local {
      display: grid;
      gap: 9px;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px dashed var(--color-borde);
      font-size: 12.5px;
      color: #5F665F;
    }
    .estado-local p { display: flex; gap: 8px; align-items: flex-start; margin: 0; line-height: 1.45; }
    .estado-local svg { width: 15px; height: 15px; flex: 0 0 15px; margin-top: 1px; color: var(--color-secundario-texto); }

    /* ---------- Estado de error ---------- */
    .estado-error__icono {
      width: 46px;
      height: 46px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #FDF3E2;
      color: #8A6A2E;
    }
    .estado-error__icono svg { width: 23px; height: 23px; }
    .estado-error h2 { text-align: center; font-size: 20px; margin-bottom: 4px; }
    .estado-error p { text-align: center; font-size: 13px; color: #6F6A60; margin-bottom: 14px; }

    /* ---------- Recuperar pedido ---------- */
    .estado-recuperar { padding: 16px; }
    .estado-recuperar__titulo {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 19px;
      color: var(--color-primario);
      margin: 0 0 3px;
    }
    .estado-recuperar > p {
      font-size: 12.5px;
      color: #6F6A60;
      line-height: 1.5;
      margin: 0 0 12px;
    }
    .estado-recuperar__campos {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .estado-recuperar .campo { margin-bottom: 0; }
    .estado-recuperar .campo input { text-transform: uppercase; }
    .estado-recuperar input::placeholder { text-transform: none; }
    .estado-recuperar__error {
      display: none;
      margin: 0 0 10px;
      font-size: 12px;
      color: #8E3030;
      background: #F8E8E8;
      border-radius: 8px;
      padding: 8px 10px;
      line-height: 1.45;
    }
    .estado-recuperar__error.visible { display: block; }

    .estado-pie {
      text-align: center;
      font-size: 10.5px;
      line-height: 1.6;
      color: #9A9488;
      margin-top: 20px;
      padding: 0 10px;
    }
    .estado-pie strong { color: #7C766A; font-weight: 600; }

    /* ---------- Actualizado ---------- */
    .estado-refresco {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
      font-size: 11px;
      color: #9A9488;
    }
    .estado-refresco .btn { padding: 7px 13px; font-size: 12px; }
    .estado-refresco .btn svg { width: 14px; height: 14px; }
    .estado-refresco .girando svg { animation: estado-girar .9s linear infinite; }

    @media (max-width: 400px) {
      .pedido__meta { grid-template-columns: 1fr 1fr; }
      .pedido__codigo { font-size: 31px; }
      .estado-recuperar__campos { grid-template-columns: 1fr; }
      .estado-pago__fila { flex-direction: column; align-items: flex-start; }
      .estado-pago img { width: 132px; height: 132px; flex-basis: 132px; align-self: center; }
    }

    @media print {
      body { background: #fff; }
      .estado-top { background: #fff; color: #000; padding: 0 0 12px; border-radius: 0; }
      .estado-top__etiqueta, .estado-recuperar, .estado-refresco, .estado-acciones, .estado-pie { display: none !important; }
      .estado-contenedor { margin-top: 0; padding: 0; }
      .pedido { box-shadow: none; border: 0; }
    }
  </style>
</head>
<body>

  <header class="estado-top">
    <div class="estado-top__inner">
      <span class="estado-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8.5 12 4l8 4.5v9L12 22l-8-4.5v-9Z"/>
          <path d="m4 8.5 8 4.5 8-4.5M12 13v9"/>
        </svg>
      </span>
      <div class="estado-top__marca">
        <strong><?= cfg.negocio_nombre ?></strong>
        <span>Estado de tu pedido</span>
      </div>
      <span class="estado-top__etiqueta">Seguimiento</span>
    </div>
  </header>

  <main class="contenedor estado-contenedor">

    <section class="tarjeta centro" id="estadoCargando" aria-live="polite">
      <p style="margin:6px 0 10px"><span class="estado-spinner" role="status" aria-label="Cargando"></span></p>
      <p class="texto-tenue" style="margin:0">Buscando tu pedido…</p>
    </section>

    <div id="estadoPrincipal" class="oculto"></div>

    <section class="tarjeta estado-recuperar" id="estadoRecuperar">
      <h2 class="estado-recuperar__titulo" id="recuperarTitulo">Buscar otro pedido</h2>
      <p id="recuperarAyuda">Ingresá el código del recibo y los últimos 4 dígitos del celular con el que registraste el pedido.</p>
      <form id="formRecuperar" novalidate>
        <div class="estado-recuperar__campos">
          <div class="campo">
            <label for="recCodigo">Código</label>
            <input id="recCodigo" type="text" inputmode="text" autocomplete="off" maxlength="12" placeholder="L-0001">
          </div>
          <div class="campo">
            <label for="recTel">Últimos 4 dígitos</label>
            <input id="recTel" type="tel" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="1234">
          </div>
        </div>
        <p class="estado-recuperar__error" id="recError" role="alert"></p>
        <button type="submit" class="btn btn-secundario btn-bloque" id="recBoton">Ver mi pedido</button>
      </form>
    </section>

    <footer class="estado-pie">
      <p><strong><?= cfg.negocio_nombre ?></strong><br>
        <?= cfg.negocio_direccion ?><br>
        <?= cfg.negocio_ciudad ?>
      </p>
      <p style="margin-top:8px">Lavandería demo · Google Sheets + Apps Script</p>
    </footer>

  </main>

  <script>
    (function () {
      'use strict';

      var BOOT = {
        token: <?!= jsonSeguro_(token) ?>,
        scriptUrl: <?!= jsonSeguro_(scriptUrl) ?>,
        negocio: <?!= jsonSeguro_(datosNegocio_(cfg)) ?>
      };

      var el = {
        cargando: document.getElementById('estadoCargando'),
        principal: document.getElementById('estadoPrincipal'),
        recuperar: document.getElementById('estadoRecuperar'),
        recuperarTitulo: document.getElementById('recuperarTitulo'),
        recuperarAyuda: document.getElementById('recuperarAyuda'),
        form: document.getElementById('formRecuperar'),
        codigo: document.getElementById('recCodigo'),
        tel: document.getElementById('recTel'),
        error: document.getElementById('recError'),
        boton: document.getElementById('recBoton')
      };

      var ordenActual = null;
      var actualizado = null;
      var girando = false;
      var timer = null;

      // ------------------------------ Helpers --------------------------------
      function esc(valor) {
        return String(valor == null ? '' : valor)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function numero(valor) {
        var n = Number(valor);
        return isFinite(n) ? n : 0;
      }

      function bs(valor) {
        var simbolo = (BOOT.negocio && BOOT.negocio.monedaSimbolo) || 'Bs.';
        var n = numero(valor);
        return (n < 0 ? '− ' : '') + simbolo + ' ' + Math.abs(n).toFixed(2).replace('.', ',');
      }

      function kg(valor) {
        var n = numero(valor);
        return (Math.round(n * 100) / 100).toString().replace('.', ',') + ' kg';
      }

      function cantidad(valor) {
        var n = numero(valor);
        return (Math.round(n * 100) / 100).toString().replace('.', ',');
      }

      function fechaHora(ms) {
        if (!ms) return '';
        try {
          return new Date(Number(ms)).toLocaleString('es-BO', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });
        } catch (err) {
          return '';
        }
      }

      function horaActual() {
        try {
          return new Date().toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit' });
        } catch (err) {
          return '';
        }
      }

      function soloDigitos(texto) {
        return String(texto == null ? '' : texto).replace(/\D/g, '');
      }

      function waLink(telefono, texto) {
        var d = soloDigitos(telefono);
        if (!d) return '';
        if (d.indexOf('00591') === 0) d = d.slice(5);
        else if (d.indexOf('591') === 0 && d.length > 8) d = d.slice(3);
        if (d.length === 8) d = '591' + d;
        return 'https://wa.me/' + d + '?text=' + encodeURIComponent(texto || '');
      }

      function urlSegura(valor) {
        var u = String(valor || '').trim();
        return /^https?:\/\//i.test(u) ? u : '';
      }

      function icono(nombre) {
        var trazos = {
          whatsapp: '<path d="M20.5 3.5A11.8 11.8 0 0 0 2.1 17.9L1 23l5.2-1.1A11.8 11.8 0 1 0 20.5 3.5Z"/><path d="M8.4 7.2c.2-.4.4-.4.7-.4h.5c.2 0 .4 0 .6.5l.8 1.9c.1.3 0 .5-.2.7l-.6.7c-.2.2-.2.4 0 .7.5.9 1.4 1.8 2.5 2.3.3.2.5.1.7-.1l.6-.7c.2-.2.4-.3.7-.2l1.9.9c.3.1.5.3.5.6 0 .8-.4 1.7-1 2.1-.6.5-1.5.7-2.4.5-1.2-.3-2.9-1-4.4-2.5-1.5-1.5-2.2-3.1-2.5-4.3-.2-.9 0-1.8.5-2.4l.7-1.3Z"/>',
          check: '<path d="m5 13 4 4L19 7"/>',
          refrescar: '<path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>',
          sobre: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
          pin: '<path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/>',
          reloj: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
          telefono: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/>',
          alerta: '<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.01"/>'
        };
        var estilo = nombre === 'whatsapp'
          ? 'fill="currentColor" stroke="none"'
          : 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
        return '<svg viewBox="0 0 24 24" ' + estilo + ' aria-hidden="true">' +
          (trazos[nombre] || '') + '</svg>';
      }

      // ------------------------------ Render ---------------------------------
      function claseEstado(estado) {
        if (estado === 'lista') return 'estado-chip--lista';
        if (estado === 'entregada') return 'estado-chip--entregada';
        if (estado === 'cancelada') return 'estado-chip--cancelada';
        return 'estado-chip--proceso';
      }

      function pasosHtml(orden) {
        var pasos = orden.pasos || [];
        if (!pasos.length) return '';
        return '<ol class="estado-pasos">' + pasos.map(function (p) {
          var clase = p.actual ? 'actual' : (p.hecho ? 'hecho' : '');
          return '<li class="estado-paso ' + clase + '">' +
            '<span class="estado-paso__punto">' + (p.hecho ? icono('check') : '') + '</span>' +
            '<span class="estado-paso__texto">' + esc(p.label) + '</span>' +
          '</li>';
        }).join('') + '</ol>';
      }

      function lineasHtml(orden) {
        var items = orden.items || [];
        if (!items.length) return '<p class="texto-tenue" style="margin:0">Sin detalle de prendas.</p>';

        return items.map(function (l) {
          var cant = l.descripcion && /kg/i.test(l.descripcion)
            ? cantidad(l.cantidad) + ' kg'
            : cantidad(l.cantidad) + ' u.';
          return '<div class="estado-linea">' +
            '<div class="estado-linea__desc">' +
              '<strong>' + esc(l.descripcion) + '</strong>' +
              '<small>' + esc(cant) + '</small>' +
            '</div>' +
            '<span class="estado-linea__monto">' + bs(l.subtotal) + '</span>' +
          '</div>';
        }).join('');
      }

      function pagoHtml(orden) {
        var saldo = numero(orden.saldo);
        var pagado = numero(orden.pagado);

        if (saldo <= 0.005) {
          return '<div class="pedido__bloque">' +
            '<p class="pedido__seccion-titulo">Pago</p>' +
            '<div class="estado-aviso">' + icono('check') +
              '<p><strong>Pedido pago.</strong> Mostrá tu código al retirar. No tenés que abonar nada más.</p>' +
            '</div>' +
          '</div>';
        }

        var qr = urlSegura(BOOT.negocio && BOOT.negocio.pagoQrUrl);
        var instrucciones = (BOOT.negocio && BOOT.negocio.pagoInstrucciones) ||
          'Escaneá el QR y guardá el comprobante.';

        var qrBloque = qr
          ? '<div class="estado-pago">' +
              '<div class="estado-pago__fila">' +
                '<img src="' + esc(qr) + '" alt="QR para pagar el pedido">' +
                '<div class="estado-pago__texto">' +
                  '<strong>Pagá ' + bs(saldo) + '</strong>' +
                  '<p>' + esc(instrucciones) + '</p>' +
                '</div>' +
              '</div>' +
              '<p class="estado-pago__nota">Después de pagar, avisanos por WhatsApp con el código ' +
                esc(orden.codigo) + ' y tu comprobante. El saldo se actualiza cuando el local lo registra.</p>' +
            '</div>'
          : '<div class="estado-aviso estado-aviso--alerta">' + icono('alerta') +
              '<p>Al retirar tenés que pagar <strong>' + bs(saldo) + '</strong>. ' +
              'Aceptamos efectivo y QR en el local.</p>' +
            '</div>';

        return '<div class="pedido__bloque">' +
          '<p class="pedido__seccion-titulo">Pago</p>' +
          (pagado > 0.005
            ? '<div class="estado-aviso" style="margin-bottom:10px">' + icono('check') +
                '<p>Ya registramos un pago de <strong>' + bs(pagado) + '</strong>.</p></div>'
            : '') +
          qrBloque +
        '</div>';
      }

      function avisosHtml(orden) {
        if (orden.estado === 'cancelada') {
          return '<div class="estado-aviso estado-aviso--alerta" style="margin-bottom:14px">' +
            icono('alerta') + '<p><strong>Pedido cancelado.</strong> Si creés que es un error, contactanos.</p></div>';
        }
        if (orden.estado === 'lista') {
          var saldo = numero(orden.saldo);
          return '<div class="estado-aviso" style="margin-bottom:14px">' + icono('check') +
            '<p><strong>Ya podés retirarlo.</strong> ' +
              (saldo > 0.005
                ? 'Al retirar abonás ' + bs(saldo) + '.'
                : 'Está pago, solo traé el código.') +
            '</p></div>';
        }
        if (orden.estado === 'entregada') {
          return '<div class="estado-aviso" style="margin-bottom:14px">' + icono('check') +
            '<p><strong>Pedido entregado.</strong>' +
              (orden.entregaMs ? ' Retirado el ' + esc(fechaHora(orden.entregaMs)) + '.' : '') +
            '</p></div>';
        }
        return '';
      }

      function accionWa(texto, etiqueta, clase) {
        var link = waLink(BOOT.negocio && BOOT.negocio.whatsapp, texto);
        if (!link) return '';
        return '<a class="btn ' + (clase || 'btn-whatsapp') + '" href="' + esc(link) + '" target="_blank" rel="noopener">' +
          icono('whatsapp') + ' ' + esc(etiqueta) + '</a>';
      }

      function telefonoLink() {
        var tel = BOOT.negocio && (BOOT.negocio.telefono || BOOT.negocio.whatsapp);
        if (!tel) return '';
        var d = soloDigitos(tel);
        if (d.length === 8) d = '591' + d;
        return '<p>' + icono('telefono') + '<a href="tel:+' + esc(d) + '" style="color:inherit">' +
          esc(BOOT.negocio.telefono || BOOT.negocio.whatsapp) + '</a></p>';
      }

      function render(orden) {
        ordenActual = orden;
        actualizado = horaActual();

        var saldo = numero(orden.saldo);
        var esLista = orden.estado === 'lista';
        var contacto = 'Hola, consulto por mi pedido ' + orden.codigo + '.';

        var acciones =
          '<div class="estado-acciones">' +
            accionWa(contacto, 'Consultar por WhatsApp') +
            (saldo > 0.005
              ? accionWa('Hola, pagué el pedido ' + orden.codigo + ' por ' + bs(saldo) + '. Les envío el comprobante.',
                  'Avisar que ya pagué', 'btn-primario')
              : '') +
          '</div>';

        var local =
          '<div class="estado-local">' +
            (BOOT.negocio.direccion
              ? '<p>' + icono('pin') + '<span>' + esc(BOOT.negocio.direccion) +
                  (BOOT.negocio.ciudad ? ', ' + esc(BOOT.negocio.ciudad) : '') + '</span></p>'
              : '') +
            (BOOT.negocio.horario ? '<p>' + icono('reloj') + '<span>Atendemos de ' + esc(BOOT.negocio.horario) + '</span></p>' : '') +
            telefonoLink() +
          '</div>';

        var cuerpo =
          '<article class="tarjeta pedido">' +
            '<header class="pedido__cabecera">' +
              '<p class="pedido__hola">Hola, ' + esc(orden.cliente || 'vecino') + '</p>' +
              '<h1 class="pedido__codigo">' + esc(orden.codigo) + '</h1>' +
              '<div class="pedido__estado-fila">' +
                '<span class="estado-chip ' + claseEstado(orden.estado) + '">' + esc(orden.estadoLabel) + '</span>' +
                (esLista ? '<span class="estado-chip estado-chip--lista">' + icono('check') + ' Listo para retirar</span>' : '') +
              '</div>' +
              '<p class="pedido__descripcion">' + esc(orden.estadoDescripcion || '') + '</p>' +
              '<div class="pedido__meta">' +
                '<div><span>Entrega</span><strong>' + esc(orden.fechaPrometidaBonita || orden.fechaPrometida) + '</strong></div>' +
                '<div><span>Prendas</span><strong>' + (orden.prendas ? esc(orden.prendas) : '—') + '</strong></div>' +
                '<div><span>Peso</span><strong>' + esc(kg(orden.pesoKg)) + '</strong></div>' +
              '</div>' +
            '</header>' +

            '<div class="pedido__cuerpo">' +
              avisosHtml(orden) +

              (orden.estado !== 'cancelada'
                ? '<div class="pedido__bloque">' +
                    '<p class="pedido__seccion-titulo">Progreso</p>' +
                    pasosHtml(orden) +
                  '</div>'
                : '') +

              '<div class="pedido__bloque">' +
                '<p class="pedido__seccion-titulo">Detalle</p>' +
                lineasHtml(orden) +
                '<div class="estado-totales">' +
                  '<div class="estado-linea"><span>Total</span><span class="estado-linea__monto">' + bs(orden.total) + '</span></div>' +
                  '<div class="estado-linea"><span>Pagado</span><span class="estado-linea__monto">' + bs(orden.pagado) + '</span></div>' +
                  '<div class="estado-total ' + (saldo > 0.005 ? 'estado-total--saldo' : 'estado-total--pago') + '">' +
                    '<span>' + (saldo > 0.005 ? 'Saldo a pagar' : 'Saldo') + '</span>' +
                    '<strong>' + bs(saldo) + '</strong>' +
                  '</div>' +
                '</div>' +
              '</div>' +

              (orden.estado !== 'cancelada' ? pagoHtml(orden) : '') +
              acciones +
              local +

              '<div class="estado-refresco">' +
                '<span id="estadoActualizado">Actualizado ' + esc(actualizado) + '</span>' +
                '<button type="button" class="btn btn-secundario" id="btnActualizar" aria-label="Actualizar estado">' +
                  '<span id="btnActualizarIcono">' + icono('refrescar') + '</span> Actualizar' +
                '</button>' +
              '</div>' +
            '</div>' +
          '</article>';

        el.principal.innerHTML = cuerpo;
        el.principal.classList.remove('oculto');
        el.cargando.classList.add('oculto');

        // El formulario de búsqueda queda como "otro pedido".
        el.recuperarTitulo.textContent = '¿Buscás otro pedido?';
        el.recuperarAyuda.textContent = 'Ingresá otro código y los últimos 4 dígitos del celular asociado.';

        var btn = document.getElementById('btnActualizar');
        if (btn) {
          btn.addEventListener('click', function () {
            if (girando) return;
            cargar(BOOT.token, true);
          });
        }
      }

      function renderError(mensaje) {
        ordenActual = null;
        el.cargando.classList.add('oculto');
        el.principal.classList.remove('oculto');
        el.principal.innerHTML =
          '<article class="tarjeta estado-error">' +
            '<div class="estado-error__icono">' + icono('alerta') + '</div>' +
            '<h2>No encontramos el pedido</h2>' +
            '<p>' + esc(mensaje || 'Revisá el link o buscá tu pedido con el código y tu celular.') + '</p>' +
            '<button type="button" class="btn btn-primario btn-bloque" id="btnReintentar">Reintentar</button>' +
          '</article>';

        el.recuperarTitulo.textContent = 'Buscar mi pedido';
        el.recuperarAyuda.textContent = 'Ingresá el código del recibo y los últimos 4 dígitos del celular con el que registraste el pedido.';

        var btn = document.getElementById('btnReintentar');
        if (btn) {
          btn.addEventListener('click', function () {
            if (BOOT.token) cargar(BOOT.token, false);
            else el.codigo.focus();
          });
        }
      }

      // ------------------------------ Carga ----------------------------------
      function llamar(nombreFuncion, args) {
        return new Promise(function (resolve) {
          if (typeof google === 'undefined' || !google.script || !google.script.run) {
            resolve({ ok: false, error: 'No hay conexión con el servidor.' });
            return;
          }
          var runner = google.script.run
            .withSuccessHandler(function (res) { resolve(res || { ok: false, error: 'Respuesta vacía.' }); })
            .withFailureHandler(function (err) {
              resolve({ ok: false, error: (err && err.message) || 'Error de conexión.' });
            });
          runner[nombreFuncion].apply(runner, args);
        });
      }

      function cargar(token, silencioso) {
        var btn = document.getElementById('btnActualizar');
        var iconoBtn = document.getElementById('btnActualizarIcono');
        if (btn && silencioso) {
          girando = true;
          btn.classList.add('girando');
        }
        if (!silencioso && !token) {
          el.cargando.classList.remove('oculto');
          el.principal.classList.add('oculto');
        }

        return llamar('consultarEstadoPublico', [token]).then(function (res) {
          girando = false;
          if (btn) btn.classList.remove('girando');

          if (!res || !res.ok) {
            if (silencioso && ordenActual) {
              var aviso = document.getElementById('estadoActualizado');
              if (aviso) aviso.textContent = 'No pudimos actualizar. Probá de nuevo.';
              return;
            }
            renderError((res && res.error) || 'No pudimos cargar el pedido.');
            return;
          }
          if (iconoBtn) iconoBtn.innerHTML = icono('refrescar');
          render(res.orden);
        });
      }

      // ----------------------------- Recuperar ------------------------------
      function mostrarErrorRecuperar(texto) {
        el.error.textContent = texto;
        el.error.classList.add('visible');
      }

      el.form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        el.error.classList.remove('visible');

        var codigo = String(el.codigo.value || '').trim();
        var digitos = soloDigitos(el.tel.value);
        if (!codigo) {
          mostrarErrorRecuperar('Ingresá el código que figura en tu recibo.');
          el.codigo.focus();
          return;
        }
        if (digitos.length !== 4) {
          mostrarErrorRecuperar('Ingresá los últimos 4 dígitos del celular.');
          el.tel.focus();
          return;
        }

        el.boton.disabled = true;
        el.boton.textContent = 'Buscando…';

        llamar('recuperarEstado', [codigo, digitos]).then(function (res) {
          el.boton.disabled = false;
          el.boton.textContent = 'Ver mi pedido';

          if (!res || !res.ok) {
            mostrarErrorRecuperar((res && res.error) || 'No pudimos verificar el pedido.');
            return;
          }

          BOOT.token = res.token;
          el.codigo.value = '';
          el.tel.value = '';

          // Intentamos reflejar el token en la URL sin recargar.
          try {
            var base = BOOT.scriptUrl || window.location.href.split('?')[0];
            window.history.replaceState(null, '', base + '?estado=' + encodeURIComponent(res.token));
          } catch (err) { /* sandbox: no es crítico */ }

          cargar(res.token, false);
        });
      });

      // ------------------------------- Arranque ------------------------------
      if (BOOT.token) {
        cargar(BOOT.token, false);
      } else {
        el.cargando.classList.add('oculto');
        el.principal.classList.add('oculto');
        el.recuperarTitulo.textContent = 'Buscar mi pedido';
        el.recuperarAyuda.textContent = 'Ingresá el código del recibo y los últimos 4 dígitos del celular con el que registraste el pedido.';
      }

      timer = window.setInterval(function () {
        if (document.visibilityState !== 'visible') return;
        if (!ordenActual || girando) return;
        if (ordenActual.estado === 'entregada' || ordenActual.estado === 'cancelada') return;
        cargar(BOOT.token, true);
      }, 60000);

      window.addEventListener('beforeunload', function () {
        window.clearInterval(timer);
      });
    })();
  </script>
</body>
</html>
